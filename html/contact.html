<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Contact</title>
    <link rel="stylesheet" href="/css/contact.css">
</head>

<body>
    <header> 
        <nav>
            <ul class="nav_bar">
                <li><a href="/index.html">Home</a></li>
                <li><a href="/html/about.html">About</a></li>
                <li><a href="/html/projects.html">Projects</a></li>
                <li><a href="/html/contact.html">Contact</a></li>
            </ul>

            <a href="/html/contact.html" class="button_contact">Contact</a>
        </nav>

    </header>

    <main class="contact_form">
        <div class="contact_form_container">
            <h1 class="contact"><span>Let's get in Touch</span></h1>
            
            <form action="#">

                <div class="input_box">
                        <input type="text" placeholder="Enter Your Name">
                        <input type="email" placeholder="Enter Your Email">
                        <input type="number" placeholder="Enter Your Phone Number">
                </div>

                <textarea name="message_box" id="message_box" cols="30" rows="10" placeholder="Enter Your Message"></textarea>
                <!-- <input type="submit" value="Send Message" id="button_send_msg"> -->
                <button type="submit" id="button_send_msg">Send Message</button>

            </form>
        </div>
    </main>

    <footer>
        <div class="social_icons">
            <a href="https://github.com/PeanutButterNJellyCrush" target="_blank"><img src="/img/github.png" alt="github_icon"></a>
            <a href="https://www.linkedin.com/in/bonnie-chiu-17324531a/"target="_blank"><img src="/img/linkedin.png" alt="linkedin_icon"></a>
        </div>
    </footer>
    
</body>
</html>
